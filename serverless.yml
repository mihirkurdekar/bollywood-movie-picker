service: bollywood-movie-picker

provider:
  name: aws
  runtime: python3.11
  region: us-east-1
  memorySize: 128

plugins:
  - serverless-wsgi
  - serverless-python-requirements

custom:
  wsgi:
    app: app.app
    packRequirements: false
#  pythonRequirements:
#    dockerizePip: true
#    layer: true
  package:
    patterns:
      - 'bollywood_movie_picker/**'

functions:
  app:
    handler: wsgi_handler.handler
    events:
      - http: ANY /
      - http: 'ANY {proxy+}'
    layers:
#      - { Ref: PythonRequirementsLambdaLayer }
       - arn:aws:lambda:us-east-1:336392948345:layer:AWSSDKPandas-Python311:22



